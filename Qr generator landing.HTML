<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanline — turn anything into a scannable code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --base: #0b0e17;
      --surface: #151926;
      --surface-raised: #1e2436;
      --line: #262c40;
      --cyan: #00e5ff;
      --violet: #7c5cff;
      --text: #f4f6fb;
      --text-soft: #8b90a3;
      --success: #3dffb0;
      --sans: 'Space Grotesk', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--base);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    /* decorative glow */
    .glow {
      position: fixed;
      top: -260px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 560px;
      background: radial-gradient(closest-side, rgba(0, 229, 255, 0.16), transparent 70%),
        radial-gradient(closest-side, rgba(124, 92, 255, 0.10), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .grid-fade {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 900px 500px at 50% 0%, black, transparent 70%);
    }

    header {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      padding: 36px 0 0;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.01em;
      text-decoration: none;
      color: var(--text);
    }

    .wordmark svg {
      display: block;
    }

    main.hero {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 56px 24px 40px;
      text-align: center;
    }

    h1 {
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 14px;
      background: linear-gradient(120deg, var(--text) 40%, var(--cyan) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-soft);
      font-size: 16px;
      margin: 0 0 36px;
      max-width: 42ch;
      margin-inline: auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.6);
      text-align: left;
    }

    #qrInput {
      width: 100%;
      font-family: var(--mono);
      font-size: 14px;
      padding: 14px 16px;
      background: var(--base);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #qrInput::placeholder {
      color: #565c72;
    }

    #qrInput:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12);
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .chip {
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 11px;
      border-radius: 8px;
      background: rgba(0, 229, 255, 0.08);
      color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.18);
      cursor: pointer;
    }

    .chip:hover {
      background: rgba(0, 229, 255, 0.14);
    }

    .qr-stage {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-raised);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      min-height: 220px;
      position: relative;
      overflow: hidden;
    }

    .qr-chip {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      transform: scale(0.94);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(.2, .8, .2, 1), opacity 0.3s ease;
    }

    .qr-chip.show {
      transform: scale(1);
      opacity: 1;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      border-radius: 4px;
      image-rendering: pixelated;
    }

    @media (prefers-reduced-motion: reduce) {
      .qr-chip {
        transition: none;
      }

      .sweep {
        animation: none !important;
      }
    }

    .sweep {
      position: absolute;
      left: 24px;
      right: 24px;
      height: 2px;
      top: 24px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0;
      pointer-events: none;
    }

    .sweep.run {
      animation: sweep 0.7s ease-out;
    }

    @keyframes sweep {
      0% {
        top: 24px;
        opacity: 1;
      }

      100% {
        top: calc(100% - 26px);
        opacity: 0;
      }
    }

    .empty-state {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-soft);
      text-align: center;
      line-height: 1.6;
    }

    .detected {
      margin-top: 16px;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--text-soft);
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-height: 18px;
      flex-wrap: wrap;
    }

    .detected .type-tag {
      color: var(--cyan);
      font-weight: 500;
    }

    .detected .value {
      color: var(--text);
      word-break: break-all;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button.primary,
    button.ghost {
      flex: 1;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 14px;
      padding: 13px 16px;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      transition: filter 0.15s ease, background 0.15s ease;
    }

    button.primary {
      background: linear-gradient(120deg, var(--cyan), var(--violet));
      color: #0b0e17;
    }

    button.primary:hover {
      filter: brightness(1.08);
    }

    button.primary:disabled {
      background: var(--surface-raised);
      color: #4b5066;
      cursor: not-allowed;
    }

    button.ghost {
      background: rgba(0, 229, 255, 0.08);
      color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.18);
    }

    button.ghost:hover {
      background: rgba(0, 229, 255, 0.14);
    }

    button.ghost:disabled {
      background: var(--surface-raised);
      color: #4b5066;
      border-color: var(--line);
      cursor: not-allowed;
    }

    .footnote {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-soft);
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px 0 40px;
      font-size: 13px;
      color: var(--text-soft);
      font-family: var(--mono);
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px;
        border-radius: 16px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>
  <div class="grid-fade"></div>

  <header>
    <a href="#" class="wordmark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        <path d="M14 14h3M14 18h7M18 14v7"></path>
      </svg>
      Scanline
    </a>
  </header>

  <main class="hero">
    <h1>Turn anything into a scannable code.</h1>
    <p class="subtitle">Paste a link, an email, or a handle. Your QR code appears instantly — nothing leaves your
      browser.</p>

    <div class="card">
      <input id="qrInput" type="text" placeholder="you@email.com, github.com/torvalds…" autocomplete="off"
        spellcheck="false" />

      <div class="chips">
        <button class="chip" data-value="hello@example.com">email</button>
        <button class="chip" data-value="github.com/torvalds">link</button>
        <button class="chip" data-value="instagram:yourname">handle</button>
      </div>

      <div class="qr-stage" id="qrStage">
        <div class="sweep" id="sweep"></div>
        <div class="qr-chip" id="qrChip">
          <div id="qrcode"></div>
        </div>
        <div class="empty-state" id="emptyState">Your code appears here</div>
      </div>

      <div class="detected" id="detected"></div>

      <div class="actions">
        <button class="ghost" id="copyBtn" disabled>Copy</button>
        <button class="primary" id="downloadBtn" disabled>Download PNG</button>
      </div>
    </div>

    <p class="footnote">Works with emails, links, social handles, or plain text.</p>
  </main>

  <footer>scanline · runs entirely in your browser</footer>

  <script>
    function detectPlatform(url) {
      const lower = url.toLowerCase();
      if (lower.includes("facebook.com")) return "Facebook";
      if (lower.includes("github.com")) return "GitHub";
      if (lower.includes("instagram.com")) return "Instagram";
      if (lower.includes("linkedin.com")) return "LinkedIn";
      if (lower.includes("twitter.com") || lower.includes("x.com")) return "Twitter/X";
      if (lower.includes("youtube.com") || lower.includes("youtu.be")) return "YouTube";
      if (lower.includes("tiktok.com")) return "TikTok";
      return "URL";
    }

    function detectAndFormat(raw) {
      const input = raw.trim();
      if (!input) return null;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (emailRegex.test(input)) {
        return { type: "Email", value: `mailto:${input}` };
      }

      if (/^https?:\/\//i.test(input)) {
        return { type: detectPlatform(input), value: input };
      }

      if (/^(www\.)?[\w-]+\.[a-z]{2,}(\/\S*)?$/i.test(input)) {
        const withProtocol = `https://${input}`;
        return { type: detectPlatform(withProtocol), value: withProtocol };
      }

      const handleMatch = input.match(/^(facebook|fb|github|instagram|ig|twitter|x|linkedin|youtube|tiktok)[:\s]+(.+)$/i);
      if (handleMatch) {
        const platform = handleMatch[1].toLowerCase();
        const handle = handleMatch[2].trim();
        const urls = {
          facebook: `https://facebook.com/${handle}`,
          fb: `https://facebook.com/${handle}`,
          github: `https://github.com/${handle}`,
          instagram: `https://instagram.com/${handle}`,
          ig: `https://instagram.com/${handle}`,
          twitter: `https://twitter.com/${handle}`,
          x: `https://x.com/${handle}`,
          linkedin: `https://linkedin.com/in/${handle}`,
          youtube: `https://youtube.com/${handle}`,
          tiktok: `https://tiktok.com/@${handle}`,
        };
        const url = urls[platform];
        return { type: detectPlatform(url), value: url };
      }

      return { type: "Text", value: input };
    }

    const input = document.getElementById('qrInput');
    const detected = document.getElementById('detected');
    const qrDiv = document.getElementById('qrcode');
    const qrChip = document.getElementById('qrChip');
    const emptyState = document.getElementById('emptyState');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');
    const sweep = document.getElementById('sweep');

    let qrInstance = null;
    let currentValue = null;

    function render() {
      const result = detectAndFormat(input.value);

      if (!result) {
        detected.innerHTML = '';
        qrChip.classList.remove('show');
        qrChip.style.display = 'none';
        emptyState.style.display = 'block';
        downloadBtn.disabled = true;
        copyBtn.disabled = true;
        currentValue = null;
        return;
      }

      detected.innerHTML = `<span class="type-tag">${result.type}</span><span class="value">${result.value}</span>`;
      emptyState.style.display = 'none';
      qrChip.style.display = 'flex';
      downloadBtn.disabled = false;
      copyBtn.disabled = false;
      currentValue = result.value;

      if (!qrInstance) {
        qrDiv.innerHTML = '';
        qrInstance = new QRCode(qrDiv, {
          text: result.value,
          width: 190,
          height: 190,
          colorDark: '#0b0e17',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        qrInstance.makeCode(result.value);
      }

      qrChip.classList.remove('show');
      requestAnimationFrame(() => qrChip.classList.add('show'));

      sweep.classList.remove('run');
      void sweep.offsetWidth;
      sweep.classList.add('run');
    }

    let debounceTimer;
    input.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(render, 120);
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        input.value = chip.dataset.value;
        input.focus();
        render();
      });
    });

    downloadBtn.addEventListener('click', () => {
      const canvas = qrDiv.querySelector('canvas');
      const link = document.createElement('a');
      link.download = 'qrcode.png';
      if (canvas) {
        link.href = canvas.toDataURL('image/png');
      } else {
        const img = qrDiv.querySelector('img');
        if (!img) return;
        link.href = img.src;
      }
      link.click();
    });

    copyBtn.addEventListener('click', async () => {
      if (!currentValue) return;
      try {
        await navigator.clipboard.writeText(currentValue);
        const original = copyBtn.textContent;
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = original; }, 1200);
      } catch (e) {
        // clipboard access denied; fail silently
      }
    });

    render();
  </script>

</body>

</html>
